<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI HTML Canvas</title>
    <link rel="stylesheet" href="/_ui/styles.css">
</head>
<body>
    <div id="controls">
        <div class="control-group">
            <label>Device</label>
            <div class="toggle-switch">
                <input type="checkbox" id="device-toggle">
                <label for="device-toggle">
                    <span class="toggle-label desktop">Desktop</span>
                    <span class="toggle-label mobile">Mobile</span>
                </label>
            </div>
        </div>
    </div>
    <div id="viewport">
        <div id="canvas"></div>
    </div>
    <script src="/_ui/main.js"></script>
</body>
</html>
