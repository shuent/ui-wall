<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-extrabold text-indigo-600 mb-2 tracking-tight">Analytics Dashboard</h1>
            <p class="text-gray-500 uppercase text-xs font-bold tracking-widest">v1: Light Theme / Centered</p>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Users</h2>
                <p class="text-3xl font-black text-gray-900 mt-2">12,450</p>
                <div class="mt-4 text-xs text-green-500 font-bold">↑ 12% from last month</div>
            </div>
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Revenue</h2>
                <p class="text-3xl font-black text-gray-900 mt-2">$45,200</p>
                <div class="mt-4 text-xs text-green-500 font-bold">↑ 8.4% from last month</div>
            </div>
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Conversions</h2>
                <p class="text-3xl font-black text-gray-900 mt-2">3.4%</p>
                <div class="mt-4 text-xs text-red-500 font-bold">↓ 0.2% from last month</div>
            </div>
        </div>
    </div>
</body>
</html>
