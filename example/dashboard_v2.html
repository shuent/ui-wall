<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-12 flex justify-between items-end border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-2xl font-black tracking-tighter text-blue-500 uppercase">ANALYTICS CORE</h1>
                <p class="text-slate-500 text-xs">Internal Telemetry Systems</p>
            </div>
            <span class="bg-blue-600/20 text-blue-400 px-3 py-1 rounded-full text-xs font-medium border border-blue-500/30">v2: High Contrast Dark</span>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-900 p-8 border border-slate-800 rounded-xl">
                <p class="text-slate-500 text-sm font-medium">Monthly Active Growth</p>
                <div class="flex items-baseline gap-2 mt-2">
                    <p class="text-5xl font-light text-blue-400 tracking-tight">+18.2%</p>
                    <span class="text-xs text-blue-600 font-mono italic">projected</span>
                </div>
            </div>
            <div class="bg-slate-900 p-8 border border-slate-800 rounded-xl">
                <p class="text-slate-500 text-sm font-medium">Unique Daily Sessions</p>
                <div class="flex items-baseline gap-2 mt-2">
                    <p class="text-5xl font-light text-purple-400 tracking-tight">1,204</p>
                    <span class="text-xs text-purple-600 font-mono italic">peak</span>
                </div>
            </div>
        </div>
        <div class="mt-6 bg-slate-900/50 p-4 border border-dashed border-slate-800 rounded-lg text-center text-slate-600 text-xs uppercase tracking-widest font-bold">
            Secondary data streams disconnected
        </div>
    </div>
</body>
</html>
