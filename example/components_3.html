<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 space-y-12 bg-white">
    <header class="border-b pb-4">
        <h1 class="text-xl font-bold">Base UI Components</h1>
        <p class="text-gray-400 text-sm italic">Atomic design primitives for internal tools.</p>
    </header>

    <section>
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-6">Buttons</h2>
        <div class="flex flex-wrap gap-4 items-center">
            <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-semibold transition shadow-md shadow-indigo-200">Primary</button>
            <button class="bg-white border-2 border-gray-100 hover:border-indigo-100 px-6 py-2 rounded-lg font-semibold transition text-gray-700">Outline</button>
            <button class="bg-gray-900 text-white px-6 py-2 rounded-full font-semibold transition hover:scale-105 active:scale-95">Pill Action</button>
            <button class="text-indigo-600 font-bold hover:underline">Ghost Link</button>
        </div>
    </section>

    <section>
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-6">Feedback Components</h2>
        <div class="space-y-3 max-w-md">
            <div class="bg-green-50 border border-green-200 p-4 rounded-xl flex gap-3 items-center">
                <span class="text-green-600 bg-white w-6 h-6 rounded-full flex items-center justify-center text-xs border border-green-200">✓</span>
                <p class="text-green-800 text-sm font-medium">Profile successfully updated!</p>
            </div>
            <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl flex gap-3 items-center">
                <span class="text-amber-600 bg-white w-6 h-6 rounded-full flex items-center justify-center text-xs border border-amber-200">!</span>
                <p class="text-amber-800 text-sm font-medium">Backup required. Please verify sync.</p>
            </div>
        </div>
    </section>

    <section>
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-6">Cards</h2>
        <div class="max-w-sm rounded-3xl overflow-hidden border border-gray-100 shadow-xl shadow-gray-100">
            <div class="h-32 bg-gradient-to-br from-indigo-500 to-purple-600"></div>
            <div class="p-6">
                <h3 class="font-bold text-lg">Modern Card Layout</h3>
                <p class="text-gray-500 text-sm mt-2 leading-relaxed">This layout demonstrates card shadows and gradients within the isolated artifact scope.</p>
                <div class="mt-6 pt-4 border-t flex justify-between items-center">
                    <span class="text-xs font-mono text-gray-400">ID: 0x442-99</span>
                    <button class="text-sm font-bold text-indigo-600">View Data</button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
